<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="dark">
		<title>Watchpost</title>
		<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
		<link rel="stylesheet" href="assets/css/style.css">
		<script defer src="assets/js/script.js"></script>
	</head>
	<body>
		<main class="auth-shell" data-watchpost-launcher data-default-host="localhost" data-default-port="7334">
		  <form class="auth-card" data-config novalidate>
		    <div class="auth-brand"><span class="brand-mark">W</span><strong>Watchpost</strong></div>
		    <div class="error" data-error role="alert" hidden></div>
		    <div class="fields"><label>Domain or IP<input name="main-host" value="localhost" placeholder="localhost or https://watchpost.example.com" autocomplete="url" spellcheck="false"></label><label>Port<input name="main-port" type="number" min="1" max="65535" value="7334"></label></div>
		    <div class="actions"><button type="submit">Save</button><button type="button" class="secondary" data-defaults>Use defaults</button></div>
		    <button type="button" class="secondary open" data-open>Open</button>
		  </form>
		</main>
	</body>
</html>
